[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-lavira-core"
version = "0.1.0"
description = "Shared LaViRA algorithm components"
requires-python = ">=3.8"
dependencies = ["openai>=1.0", "numpy", "Pillow", "opencv-python"]

[tool.setuptools.packages.find]
include = ["lavira*"]
